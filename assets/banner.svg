<svg width="1000" height="260" viewBox="0 0 1000 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080102" />
      <stop offset="45%" stop-color="#140205" />
      <stop offset="75%" stop-color="#240309" />
      <stop offset="100%" stop-color="#0a0103" />
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ff1a35" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#990014" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#3d0008" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ff2a3d" stroke-width="0.8" stroke-opacity="0.09" />
      <circle cx="36" cy="36" r="1" fill="#ff2a3d" fill-opacity="0.25" />
    </pattern>

    <!-- Text Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fff0f2" />
      <stop offset="85%" stop-color="#ff4757" />
      <stop offset="100%" stop-color="#d61426" />
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#400008" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#7a0012" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3b0007" stop-opacity="0.6" />
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e000f" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#a8071a" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#e01026" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#59000c" stop-opacity="0.75" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2e44" stop-opacity="0" />
      <stop offset="25%" stop-color="#ff2e44" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#ff2e44" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff2e44" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 72px;
      letter-spacing: 4px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 6px;
      fill: #ff8592;
      text-transform: uppercase;
    }
    .bracket {
      font-family: monospace;
      font-weight: 300;
      font-size: 64px;
      fill: #ff2a3d;
      opacity: 0.65;
    }
    .accent-tag {
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 2px;
      fill: #ff4757;
      opacity: 0.8;
    }
  </style>

  <!-- Base Rectangle -->
  <rect width="1000" height="260" rx="12" fill="url(#bgGrad)" />

  <!-- Grid Background -->
  <rect width="1000" height="260" rx="12" fill="url(#cyberGrid)" />

  <!-- Ambient Center Glow -->
  <rect width="1000" height="260" rx="12" fill="url(#centerGlow)" />

  <!-- Tech Crosshairs / Corner Marks -->
  <g opacity="0.4" stroke="#ff2a3d" stroke-width="1.5">
    <!-- Top-Left -->
    <path d="M 28 20 L 28 32 M 22 26 L 34 26" />
    <!-- Top-Right -->
    <path d="M 972 20 L 972 32 M 966 26 L 978 26" />
    <!-- Framing brackets -->
    <path d="M 20 44 L 20 20 L 44 20" fill="none" stroke-width="1" />
    <path d="M 980 44 L 980 20 L 956 20" fill="none" stroke-width="1" />
  </g>

  <!-- Top Status Badge -->
  <g transform="translate(500, 42)">
    <rect x="-115" y="-12" width="230" height="24" rx="12" fill="#240206" stroke="#ff2a3d" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="-92" cy="0" r="3.5" fill="#ff1a35">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="5" y="4" text-anchor="middle" class="accent-tag">DEVELOPER // PORTFOLIO</text>
  </g>

  <!-- Central Title: yToldh -->
  <!-- Subtle Back Glow -->
  <text x="500" y="142" text-anchor="middle" class="title-text" fill="#ff1a35" filter="url(#neonGlow)" opacity="0.6">yToldh</text>
  <!-- Main Crisp Text -->
  <text x="500" y="142" text-anchor="middle" class="title-text" fill="url(#textGrad)">yToldh</text>

  <!-- Decorative Brackets around Name -->
  <text x="325" y="137" text-anchor="middle" class="bracket">&#60;</text>
  <text x="675" y="137" text-anchor="middle" class="bracket">&#47;&#62;</text>

  <!-- Subtitle -->
  <text x="500" y="180" text-anchor="middle" class="sub-text">GAME DEV • SOFTWARE • CREATIVE AI</text>

  <!-- Flowing Bottom Waves -->
  <!-- Layer 1: Dark Crimson Deep Wave -->
  <path d="M 0 215 C 220 245 380 195 560 220 C 740 245 880 215 1000 230 L 1000 260 L 0 260 Z" fill="url(#waveGrad1)" />

  <!-- Layer 2: Main Vibrant Red Wave -->
  <path d="M 0 232 C 180 205 340 248 520 225 C 700 202 850 238 1000 218 L 1000 260 L 0 260 Z" fill="url(#waveGrad2)" />

  <!-- Top Accent Glowing Horizon Line -->
  <path d="M 0 232 C 180 205 340 248 520 225 C 700 202 850 238 1000 218" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" />
</svg>
